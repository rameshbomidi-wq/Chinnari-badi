<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>చిన్నారి బడి – రాయ్ ఎడ్యుకేషన్</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@500;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14213D;--panel:#1F3160;--panel2:#2A4180;--ink:#FFF8E7;--dim:#AFC0E8;
  --focus:#FFC93C;--learn:#3DDC97;--do:#FF8C42;--quiz:#5BC0EB;--bad:#FF5A6E;--paper:#FFFDF6;--dark:#14213D;--think:#F15BB5;
  font-family:'Baloo Tammudu 2','Noto Sans Telugu','Noto Sans Devanagari',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-size:clamp(16px,1.45vw,30px);min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
kbd{font:inherit;background:var(--panel2);color:var(--ink);border-radius:.35em;padding:0 .45em;margin:0 .15em}
.top{display:flex;align-items:center;gap:.8em;padding:.45em 1.2em;padding-top:calc(.45em + env(safe-area-inset-top,0px));background:#0E1830;position:sticky;top:0;z-index:5}
.top h1{flex:1;font-size:1.45em;font-weight:800;line-height:1.1}
.top h1 small{display:block;font-size:.5em;font-weight:500;color:var(--dim)}
.hbtn{font-size:1.3em;width:2.1em;height:2.1em;border-radius:50%;background:var(--panel)}
.hbtn.off{opacity:.45}
.f:focus{outline:.28em solid var(--focus);outline-offset:.18em;transform:scale(1.05);position:relative;z-index:2}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#hint{text-align:center;color:var(--dim);font-size:.85em;padding:.3em .6em;line-height:1.8}
footer{text-align:center;padding:.3em;font-weight:800;color:var(--focus);font-size:1.05em}
#toast{position:fixed;left:50%;bottom:3.5em;transform:translateX(-50%);background:#0E1830;border:2px solid var(--focus);border-radius:.8em;padding:.6em 1em;max-width:90vw;text-align:center;display:none;z-index:9}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-.4em)}75%{transform:translateX(.4em)}}
@keyframes pulse{50%{transform:scale(1.35)}}
@keyframes dash{to{stroke-dashoffset:-34}}
@keyframes ink{80%{stroke-dashoffset:0;fill:transparent}100%{stroke-dashoffset:0;fill:rgba(230,57,70,.22)}}

/* home */
.home{width:100%;max-width:1760px;margin:0 auto;padding:.6em 1.2em 1.5em}
.hero{display:flex;align-items:center;gap:1em;padding:.4em 0 .2em}
.hero .glyphs{font-size:3em;font-weight:800;line-height:1;letter-spacing:.05em}
.hero .glyphs span:nth-child(1){color:var(--learn)}.hero .glyphs span:nth-child(2){color:var(--do)}.hero .glyphs span:nth-child(3){color:var(--quiz)}.hero .glyphs span:nth-child(4){color:var(--focus)}
.hero p{color:var(--dim);line-height:1.4}
.sec h2{font-size:1.2em;margin:.9em 0 .45em;display:flex;align-items:center;gap:.45em}
.sec h2 i{width:.7em;height:.7em;border-radius:50%;background:var(--c)}
.sec h2 em{font-style:normal;color:var(--dim);font-size:.7em;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6em,1fr));gap:.75em}
.tile{background:var(--panel);border-radius:.9em;padding:.7em .5em .6em;display:flex;flex-direction:column;align-items:center;text-align:center;border-bottom:.3em solid var(--c);transition:transform .12s}
.tile .ic{font-size:2.3em;line-height:1.25}
.tile .tn{font-weight:700;line-height:1.25;margin-top:.15em}
.tile .en{font-size:.7em;color:var(--dim)}

/* shared view */
.view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;padding:.8em;width:100%}
.bar{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
.cb{background:var(--panel2);border-radius:.8em;padding:.25em 1em;font-size:1.2em;font-weight:700}
.cb.on{background:var(--learn);color:#0C2A1C}
.count{color:var(--dim);font-weight:700}
.status{font-size:1.3em;font-weight:800;text-align:center;min-height:1.5em}

/* flash */
.fcard{width:min(94vw,1150px);flex:1;max-height:64vh;min-height:14em;background:var(--panel);border-radius:1.4em;display:flex;align-items:center;justify-content:center;gap:1.4em 2.5em;padding:1em 1.5em;flex-wrap:wrap;text-align:center}
.fcard.pop{animation:pop .35s ease}
.fbig{font-size:min(30vh,24vw);line-height:1.05;font-weight:800;color:var(--focus)}
.fbig.lat{font-family:system-ui,sans-serif;letter-spacing:.02em}
.fbig.dev,.dev{font-family:'Noto Sans Devanagari',sans-serif}
.fbig.em{font-size:min(26vh,22vw)}
.fbig .shp{width:min(34vh,30vw);height:min(34vh,30vw);display:block}
.fsw{width:min(30vh,26vw);height:min(30vh,26vw);border-radius:50%;border:.2em solid #fff5}
.ftx{display:flex;flex-direction:column;gap:.2em;max-width:34em}
.l1{font-size:2.1em;font-weight:800;line-height:1.25}
.l1.long{font-size:1.6em}
.l2{font-size:1.35em;color:var(--dim);line-height:1.3}
.l3{font-size:1.1em;line-height:1.35}

/* paper boards */
.board{position:relative;background:var(--paper);border-radius:1em;overflow:hidden;box-shadow:0 .4em 0 #0B1428}
.board canvas,.board svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.b21{width:min(94vw,calc(58vh*2));aspect-ratio:2/1}
.b43{width:min(92vw,calc(58vh*4/3));aspect-ratio:4/3}
.b53{width:min(94vw,calc(58vh*5/3));aspect-ratio:5/3}
.pencil{position:absolute;font-size:2em;transform:translate(-15%,-85%);pointer-events:none;display:none}
.wguide{fill:none;stroke:#9AA7C7;stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round}
.wink{fill:transparent;stroke:#E63946;stroke-width:5;stroke-dasharray:1600;stroke-dashoffset:1600;stroke-linejoin:round}
.wink.go{animation:ink 3.2s ease forwards}
.nextdot{animation:pulse 1s infinite;transform-box:fill-box;transform-origin:center}
.rg{cursor:pointer}
.rg.sel{stroke:#FF8C42;stroke-width:7;stroke-dasharray:10 7;animation:dash 1s linear infinite}
.pal{display:flex;gap:.55em;flex-wrap:wrap;justify-content:center;align-items:center}
.pal i{width:2.1em;height:2.1em;border-radius:50%;border:3px solid #ffffff55;cursor:pointer}
.pal i.on{outline:.25em solid var(--focus);outline-offset:.18em;transform:scale(1.15)}
.pal .cb.on{background:var(--focus);color:var(--dark)}
.dpad{display:grid;grid-template-columns:repeat(3,2.6em);gap:.3em}
.dpad button{background:var(--panel2);border-radius:.6em;height:2.2em;font-size:1.1em}

/* quiz */
.quiz{width:min(94vw,1200px);flex:1;display:flex;flex-direction:column;gap:.75em;padding:.6em 0}
.qtop{display:flex;align-items:center;gap:.8em}
.qq{flex:1;font-size:1.55em;font-weight:800;line-height:1.3}
.qsc{background:var(--panel);border-radius:2em;padding:.15em .9em;font-weight:700;white-space:nowrap}
.qvis{background:var(--panel);border-radius:1.2em;min-height:26vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.25em .4em;padding:.8em;font-size:2.5em;text-align:center;line-height:1.2}
.qvis.pop{animation:pop .35s ease}
.qbig{font-size:2.2em}
.qword{font-size:1.4em;font-weight:800;color:var(--focus)}
.qtext{font-size:.55em;font-weight:700;line-height:1.5;max-width:30em}
.qvis .op{color:var(--focus);font-weight:800;margin:0 .2em}
.gone{position:relative;opacity:.4}
.gone::after{content:'✕';position:absolute;inset:0;color:var(--bad);font-weight:800;display:flex;align-items:center;justify-content:center}
.seq{display:flex;gap:.3em;flex-wrap:wrap;justify-content:center}
.seq span{min-width:1.5em;padding:0 .3em;background:var(--panel2);border-radius:.3em}
.seq span.q{background:var(--focus);color:var(--dark)}
.lat{font-family:system-ui,sans-serif}
.clock{width:min(38vh,60vw);height:min(38vh,60vw)}
.clock text{font-size:17px;font-weight:700;fill:#14213D;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif}
.qops{display:grid;grid-template-columns:1fr 1fr;gap:.75em}
.opt{background:var(--panel2);border-radius:1em;padding:.35em .5em;font-size:1.65em;font-weight:800;min-height:2.4em;border:3px solid transparent;line-height:1.2}
.opt small{display:block;font-size:.55em;font-weight:500;color:var(--dim)}
.opt .oe{font-size:1.5em}
.opt.ok{background:var(--learn);color:#0C2A1C}.opt.ok small{color:#0C2A1C}
.opt.no{background:var(--bad);animation:shake .4s}
.opt.txt{font-size:1.12em;font-weight:700;text-align:left;padding:.5em .8em}
.opt.nextq{background:var(--focus);color:var(--dark);text-align:center}
.qhead{font-size:1.4em;line-height:1}
.why{width:100%;font-size:.46em;font-weight:700;color:var(--learn);margin-top:.3em;line-height:1.5}

@media (max-width:700px){.opt.txt{font-size:.95em}.fcard{flex-direction:column;gap:.6em}.fbig{font-size:34vw}.qvis{font-size:1.9em}.opt{font-size:1.35em}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="f hbtn" id="homeBtn" aria-label="హోమ్" style="display:none">🏠</button>
  <h1 id="title">చిన్నారి బడి<small>నర్సరీ, LKG, UKG</small></h1>
  <button class="f hbtn" id="voiceBtn" aria-label="వాయిస్">🔊</button>
</header>
<main id="stage"></main>
<div id="hint"></div>
<footer>రాయ్ ఎడ్యుకేషన్</footer>
<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const P=s=>s.trim().split(';').map(x=>x.trim().split('|'));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',5000)}

/* ---------- voice ---------- */
const LANG={te:'te-IN',en:'en-IN',hi:'hi-IN'};
let voiceOn=true;try{voiceOn=localStorage.getItem('cb_voice')!=='0'}catch(e){}
let voices=[];const hasTTS='speechSynthesis' in window;
function loadV(){voices=speechSynthesis.getVoices()}
if(hasTTS){loadV();speechSynthesis.onvoiceschanged=loadV}
function voiceFor(l){const c=LANG[l].toLowerCase();return voices.find(v=>v.lang.toLowerCase().replace('_','-')===c)||voices.find(v=>v.lang.toLowerCase().startsWith(l))}
const warned={};
function speak(parts){
  if(!voiceOn||!hasTTS||!parts)return;
  speechSynthesis.cancel();
  setTimeout(()=>parts.forEach(([t,l='te'])=>{
    if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang=LANG[l];
    const v=voiceFor(l);if(v)u.voice=v;
    else if(voices.length&&!warned[l]){warned[l]=1;toast(`ఈ పరికరంలో ${l==='te'?'తెలుగు':l==='hi'?'హిందీ':'ఇంగ్లీష్'} వాయిస్ లేదు. Settings → Text-to-speech లో ఆ భాష వాయిస్ ఇన్‌స్టాల్ చేయండి.`)}
    u.rate=l==='en'?0.85:0.9;speechSynthesis.speak(u);
  }),60);
}
let actx;function beep(ok){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=ok?660:200;o.type=ok?'triangle':'sawtooth';g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.35);o.start();o.stop(actx.currentTime+.35)}catch(e){}}
const PRAISE=['భలే!','బాగుంది!','శభాష్!','చాలా బాగుంది!','సూపర్!'];

/* ---------- numbers ---------- */
const TEN=['సున్నా','ఒకటి','రెండు','మూడు','నాలుగు','ఐదు','ఆరు','ఏడు','ఎనిమిది','తొమ్మిది','పది','పదకొండు','పన్నెండు','పదమూడు','పద్నాలుగు','పదిహేను','పదహారు','పదిహేడు','పద్దెనిమిది','పందొమ్మిది','ఇరవై'];
const HIN=['शून्य','एक','दो','तीन','चार','पाँच','छह','सात','आठ','नौ','दस','ग्यारह','बारह','तेरह','चौदह','पंद्रह','सोलह','सत्रह','अठारह','उन्नीस','बीस'];
const ENN=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty'];
const tDig=n=>String(n).replace(/\d/g,d=>'౦౧౨౩౪౫౬౭౮౯'[d]);
const hDig=n=>String(n).replace(/\d/g,d=>'०१२३४५६७८९'[d]);
const sayN=n=>n<=20?[TEN[n],'te']:[String(n),'en'];
const HALF=['','ఒంటిగంటన్నర','రెండున్నర','మూడున్నర','నాలుగున్నర','ఐదున్నర','ఆరున్నర','ఏడున్నర','ఎనిమిదిన్నర','తొమ్మిదిన్నర','పదిన్నర','పదకొండున్నర','పన్నెండున్నర'];

/* ---------- data ---------- */
const VOW=P(`అ|అమ్మ|👩;ఆ|ఆవు|🐄;ఇ|ఇల్లు|🏠;ఈ|ఈగ|🪰;ఉ|ఉడుత|🐿️;ఊ|ఊయల|;ఋ|ఋషి|🧘;ౠ||;ఎ|ఎలుక|🐀;ఏ|ఏనుగు|🐘;ఐ|ఐదు|5️⃣;ఒ|ఒంటె|🐪;ఓ|ఓడ|🚢;ఔ|ఔషధం|💊;అం|అంగడి|🏪;అః||`);
const CON=P(`క|కలం|🖊️;ఖ|ఖడ్గం|🗡️;గ|గంట|🔔;ఘ|ఘటం|🏺;ఙ||;చ|చిలుక|🦜;ఛ|ఛత్రి|☂️;జ|జింక|🦌;ఝ|ఝరి|🏞️;ఞ||;ట|టమాట|🍅;ఠ|మఠం|🛕;డ|డప్పు|🥁;ఢ|ఢంకా|🪘;ణ|బాణం|🏹;త|తాబేలు|🐢;థ|రథం|;ద|దీపం|🪔;ధ|ధాన్యం|🌾;న|నక్క|🦊;ప|పడవ|⛵;ఫ|ఫలం|🍎;బ|బంతి|⚽;భ|భవనం|🏢;మ|మామిడి|🥭;య|యంత్రం|⚙️;ర|రైలు|🚂;ల|లడ్డు|;వ|వంతెన|🌉;శ|శంఖం|🐚;ష|షట్కోణం|⬡;స|సింహం|🦁;హ|హంస|🦢;ళ|తాళం|🔒;క్ష|క్షీరం|🥛;ఱ|ఱంపం|🪚`);
const ENG=P(`A|Apple|ఆపిల్|🍎;B|Ball|బంతి|⚽;C|Cat|పిల్లి|🐱;D|Dog|కుక్క|🐶;E|Elephant|ఏనుగు|🐘;F|Fish|చేప|🐟;G|Goat|మేక|🐐;H|Hat|టోపీ|🎩;I|Ice cream|ఐస్‌క్రీమ్|🍦;J|Jug|జగ్గు|🏺;K|Kite|గాలిపటం|🪁;L|Lion|సింహం|🦁;M|Mango|మామిడి|🥭;N|Nose|ముక్కు|👃;O|Owl|గుడ్లగూబ|🦉;P|Parrot|చిలుక|🦜;Q|Queen|రాణి|👸;R|Rabbit|కుందేలు|🐇;S|Sun|సూర్యుడు|☀️;T|Tiger|పులి|🐅;U|Umbrella|గొడుగు|☂️;V|Van|వ్యాన్|🚐;W|Watch|గడియారం|⌚;X|X-mas tree|క్రిస్మస్ చెట్టు|🎄;Y|Yo-yo|యో-యో|🪀;Z|Zebra|జీబ్రా|🦓`);
const HV=P(`अ|अनार|;आ|आम|🥭;इ|इमली|;ई|ईख|🎋;उ|उल्लू|🦉;ऊ|ऊन|🧶;ऋ|ऋषि|🧘;ए|एक|1️⃣;ऐ|ऐनक|👓;ओ|ओखली|;औ|औरत|👩;अं|अंगूर|🍇;अः||`);

let view=null,navKey=false;
function keyOf(e){const k=e.key,c=e.keyCode;
  if(k==='ArrowLeft'||c===37)return'left';if(k==='ArrowRight'||c===39)return'right';
  if(k==='ArrowUp'||c===38)return'up';if(k==='ArrowDown'||c===40)return'down';
  if(k==='Enter'||c===13||c===23)return'ok';
  if(['Escape','Backspace','GoBack','BrowserBack'].includes(k)||[27,8,10009,461,166].includes(c))return'back';
  if(k==='MediaPlayPause'||k===' '||[179,415,10252,19,32].includes(c))return'play';return null}
function focusables(){return[...document.querySelectorAll('.f')].filter(e=>e.getClientRects().length&&!e.disabled)}
function spatial(dir){
  const els=focusables(),cur=document.activeElement;
  if(!els.includes(cur)){if(els.length){navKey=true;(els.find(e=>e.closest('#stage'))||els[0]).focus()}return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const e of els){if(e===cur)continue;const q=e.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
    let main,cross;if(dir==='right'){main=dx;cross=Math.abs(dy)}else if(dir==='left'){main=-dx;cross=Math.abs(dy)}else if(dir==='down'){main=dy;cross=Math.abs(dx)}else{main=-dy;cross=Math.abs(dx)}
    if(main<=4)continue;const s=main+cross*2.3;if(s<bs){bs=s;best=e}}
  if(best){navKey=true;best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}
}
document.addEventListener('focusin',e=>{const t=e.target;if(navKey&&t.dataset&&t.dataset.say){try{speak(JSON.parse(t.dataset.say))}catch(x){}}navKey=false});
document.addEventListener('keydown',e=>{
  const k=keyOf(e);if(!k)return;
  if(k==='back'){if(view&&view.id){e.preventDefault();goHome()}return}
  if(view&&view.key&&view.key(k)){e.preventDefault();return}
  if(['left','right','up','down'].includes(k)){e.preventDefault();spatial(k)}
  else if(k==='ok'&&!document.activeElement.classList.contains('f')){e.preventDefault();spatial('down')}
});

$('#voiceBtn').onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem('cb_voice',voiceOn?'1':'0')}catch(e){}setVoiceBtn();if(!voiceOn&&hasTTS)speechSynthesis.cancel();else speak([['వాయిస్ ఆన్']])};

  const fc=$('#fc');

    fc.classList.remove('pop');void fc.offsetWidth;fc.classList.add('pop');$('#fn').textContent=`${i+1} / ${n}`;if(sp)speak(it.say)}
  const go=d=>{i=(i+d+n)%n;show()};
  function toggle(){const b=st.querySelector('[data-a=auto]');if(auto){clearInterval(auto);auto=null;b.classList.remove('on');b.textContent='▶ ఆటో'}else{auto=setInterval(()=>go(1),5500);b.classList.add('on');b.textContent='⏸ ఆపు';go(1)}}
  st.querySelector('.bar').onclick=e=>{const a=e.target.closest('button')?.dataset.a;if(a==='prev')go(-1);if(a==='next')go(1);if(a==='say')speak(items[i].say);if(a==='auto')toggle()};
  fc.onclick=()=>speak(items[i].say);
  show();
  hint('<kbd>◀ ▶</kbd> మార్చు <kbd>OK</kbd> వినిపించు <kbd>▲</kbd> ఆటో ప్లే <kbd>Back</kbd> హోమ్');
  return{key:k=>{if(k==='left')go(-1);else if(k==='right')go(1);else if(k==='ok'||k==='down')speak(items[i].say);else if(k==='up'||k==='play')toggle();else return false;return true},destroy:()=>clearInterval(auto)};
}}

function attachDraw(cv,color,w){const c=cv.getContext('2d');let on=false;
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{on=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);c.beginPath();c.moveTo(x,y);c.lineTo(x+.1,y);c.strokeStyle=color;c.lineWidth=w;c.lineCap=c.lineJoin='round';c.stroke()};
  cv.onpointermove=e=>{if(!on)return;const[x,y]=pt(e);c.lineTo(x,y);c.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>on=false;
  return()=>c.clearRect(0,0,cv.width,cv.height)}

function dens(p,s=5){const o=[p[0]];for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],n=Math.max(1,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/s));for(let k=1;k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return o}
function fp(f,t0,t1,n){const o=[];for(let i=0;i<=n;i++)o.push(f(t0+(t1-t0)*i/n));return o}

  ['అడ్డ గీతలు','Sleeping lines',()=>[80,160,240,320].map(y=>dens([[60,y],[740,y]]))],
  ['ఏటవాలు గీతలు','Slanting lines',()=>{const L=[];for(let x=60;x<=640;x+=72)L.push(dens([[x,340],[x+100,60]]));return L}],
  ['జిగ్‌జాగ్ గీతలు','Zigzag lines',()=>[120,280].map(cy=>{const p=[];for(let i=0;i<=17;i++)p.push([60+i*40,cy+(i%2?-50:50)]);return dens(p)})],
  ['అలల గీతలు','Wave lines',()=>[120,280].map(cy=>fp(t=>[60+t,cy+45*Math.sin(t/113*Math.PI*2)],0,680,220))],
  ['కొండ గీతలు','Hill lines',()=>[160,330].map(by=>fp(t=>[60+t,by-90*Math.abs(Math.sin(t/113.4*Math.PI))],0,680,260))],

function genMaze(C,R){const cells=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++)cells.push({x,y,w:[1,1,1,1],v:0});
  const at=(x,y)=>cells[y*C+x],D=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]],st=[at(0,0)];at(0,0).v=1;
  while(st.length){const c=st[st.length-1];const nb=D.map(d=>[d,c.x+d[0],c.y+d[1]]).filter(([d,x,y])=>x>=0&&y>=0&&x<C&&y<R&&!at(x,y).v);
    if(!nb.length){st.pop();continue}const[d,x,y]=pick(nb),nn=at(x,y);c.w[d[2]]=0;nn.w[d[3]]=0;nn.v=1;st.push(nn)}return{C,R,at}}

  const g=$('#mc').getContext('2d');let cs,ox,oy;

  function draw(){g.clearRect(0,0,800,480);const c=p=>[ox+(p[0]+.5)*cs,oy+(p[1]+.5)*cs];
    g.strokeStyle='rgba(255,201,60,.7)';g.lineWidth=cs*.28;g.lineCap=g.lineJoin='round';g.beginPath();trail.forEach((p,k)=>{const[x,y]=c(p);k?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();

    for(let y=0;y<M.R;y++)for(let x=0;x<M.C;x++){const w=M.at(x,y).w,X=ox+x*cs,Y=oy+y*cs;
      if(w[0]){g.moveTo(X,Y);g.lineTo(X+cs,Y)}if(w[1]){g.moveTo(X+cs,Y);g.lineTo(X+cs,Y+cs)}if(w[2]){g.moveTo(X,Y+cs);g.lineTo(X+cs,Y+cs)}if(w[3]){g.moveTo(X,Y);g.lineTo(X,Y+cs)}}
    g.stroke();g.font=`${cs*.62}px sans-serif`;g.textAlign='center';g.textBaseline='middle';
    let[a,b]=c([M.C-1,M.R-1]);g.fillText('🧀',a,b);[a,b]=c([px,py]);g.fillText(won?'🎉':'🐭',a,b)}
  function move(d){if(won){if(d==='ok'){lv++;fresh();speak([['కొత్త దారి']])}return}
    if(d==='ok'){fresh();return}const di={up:0,right:1,down:2,left:3}[d],dx=[0,1,0,-1][di],dy=[-1,0,1,0][di];

/* ---------- screens ---------- */
let lastTile='tel';
function destroyView(){if(view&&view.destroy)view.destroy();if(hasTTS)speechSynthesis.cancel()}
function showHome(){destroyView();view={id:null};$('#homeBtn').style.display='none';
  $('#title').innerHTML=`చిన్నారి బడి<small>నర్సరీ, LKG, UKG – ${TOPICS.length} అంశాలు</small>`;
  const st=$('#stage');
  st.innerHTML=`<div class="home"><div class="hero"><div class="glyphs"><span>అ</span><span>A</span><span>क</span><span>1</span></div><p>తెలుగు, ఇంగ్లీష్, హిందీ – చూసి, విని, ఆడుతూ నేర్చుకుందాం.<br>రిమోట్ బాణాలతో అంశం ఎంచుకుని OK నొక్కండి.</p></div>`+
    Object.entries(SECT).map(([k,[te,sub,c]])=>`<section class="sec" style="--c:${c}"><h2><i></i>${te} <em>${sub}</em></h2><div class="grid">`+
    TOPICS.filter(t=>t[1]===k).map(([id,,ic,te2,en])=>`<button class="f tile" data-id="${id}" data-say='${JSON.stringify([[te2]])}'><span class="ic">${ic}</span><span class="tn">${te2}</span><span class="en">${en}</span></button>`).join('')+`</div></section>`).join('')+`</div>`;
  st.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openTopic(b.dataset.id));
  const f=st.querySelector(`[data-id="${lastTile}"]`)||st.querySelector('.tile');f.focus({preventScroll:true});f.scrollIntoView({block:'center'});
  hint('<kbd>◀ ▲ ▼ ▶</kbd> ఎంచుకో <kbd>OK</kbd> తెరువు <kbd>🔊</kbd> పై బటన్‌తో వాయిస్ ఆన్/ఆఫ్');
}
function openTopic(id,push=true){const t=TOPICS.find(x=>x[0]===id);if(!t)return;destroyView();lastTile=id;
  if(push)history.pushState({t:id},'');
  $('#homeBtn').style.display='';$('#title').innerHTML=`${t[3]}<small>${t[4]}</small>`;
  const st=$('#stage');st.innerHTML='';document.activeElement&&document.activeElement.blur();
  const v=t[5]()(st)||{};v.id=id;view=v;window.scrollTo(0,0);
  if(!st.querySelector('.f:focus'))document.body.focus();
}
function goHome(){if(history.state&&history.state.t)history.back();else showHome()}
window.addEventListener('popstate',()=>{if(view&&view.id)showHome()});
history.replaceState(null,'');
showHome();
</script>
